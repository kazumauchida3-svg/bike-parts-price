class="selected-bike-name"

id="selectedBikeYear"
class="small"

class="summary-number"

0

</div>

<div class="small">
購入済み
</div>

class="summary-number"
id="purchasedCount"
>
0

<script>


/* =================================
データ構造
================================= */


let data =
JSON.parse(
localStorage.getItem("bikeRestoreV4")
) || {

    bikes:[]

};


let selectedBikeId = null;

let editingBikeId = null;

let currentPartId = null;



/* =================================
ID
================================= */


function newId(){

return Date.now() +
Math.floor(
Math.random()*10000
);

}



/* =================================
保存
================================= */


function saveData(){

localStorage.setItem(

"bikeRestoreV4",

JSON.stringify(data)

);

}



/* =================================
バイク追加
================================= */


function openBikeModal(){

editingBikeId=null;

document
.getElementById("bikeModalTitle")
.textContent=
"🏍 バイクを追加";


document
.getElementById("bikeName")
.value="";


document
.getElementById("bikeYear")
.value="";


document
.getElementById("bikeMemo")
.value="";


document
.getElementById("bikeModal")
.style.display="block";

}



/* =================================
バイク編集
================================= */


function editBike(id){

const bike =
data.bikes.find(
b=>b.id===id
);


if(!bike) return;


editingBikeId=id;


document
.getElementById("bikeModalTitle")
.textContent=
"✏️ バイクを編集";


document
.getElementById("bikeName")
.value=
bike.name;


document
.getElementById("bikeYear")
.value=
bike.year;


document
.getElementById("bikeMemo")
.value=
bike.memo || "";


document
.getElementById("bikeModal")
.style.display="block";

}



/* =================================
バイク保存
================================= */


function saveBike(){

const name =
document
.getElementById("bikeName")
.value
.trim();


const year =
document
.getElementById("bikeYear")
.value
.trim();


const memo =
document
.getElementById("bikeMemo")
.value
.trim();


if(!name){

alert(
"車種を入力してください。"
);

return;

}


if(editingBikeId){

const bike =
data.bikes.find(
b=>b.id===editingBikeId
);


bike.name=name;

bike.year=year;

bike.memo=memo;

}

else{

const bike={

id:newId(),

name:name,

year:year,

memo:memo,

parts:[]

};


data.bikes.push(bike);


selectedBikeId=bike.id;

}


saveData();

closeBikeModal();

renderAll();

}



/* =================================
バイク削除
================================= */


function deleteBike(id){

const bike =
data.bikes.find(
b=>b.id===id
);


if(!bike) return;


const result =
confirm(

"「"+
bike.name+
"」を削除しますか？\n\n"+
"このバイクに登録した部品情報も削除されます。"

);


if(!result) return;


data.bikes =
data.bikes.filter(
b=>b.id!==id
);


if(selectedBikeId===id){

selectedBikeId =
data.bikes.length
?
data.bikes[0].id
:null;

}


saveData();

renderAll();

}



/* =================================
バイク選択
================================= */


function selectBike(id){

selectedBikeId=id;

renderAll();

window.scrollTo({

top:0,

behavior:"smooth"

});

}



/* =================================
バイク一覧
================================= */


function renderBikes(){

const list =
document
.getElementById("bikeList");


list.innerHTML="";


if(data.bikes.length===0){

list.innerHTML=`

<div
class="empty"
style="grid-column:1/-1"
>

まだバイクが登録されていません。

</div>

`;

return;

}


data.bikes.forEach(
function(bike){

const card =
document.createElement("div");


card.className=
"bike-card";


if(
bike.id===
selectedBikeId
){

card.classList.add(
"active"
);

}


const parts =
bike.parts || [];


const purchased =
parts.filter(
p=>p.purchased
).length;


let total=0;


parts.forEach(
function(part){

if(part.purchased){

total +=
Number(
part.purchasePrice
) *
Number(
part.quantity
);

}

});


card.innerHTML=`

<div
class="bike-name"
>

${escapeHTML(
bike.name
)}

</div>


<div
class="bike-year"
>

${bike.year
?
escapeHTML(
bike.year
)+"年"
:"年式未登録"}

</div>


<div
class="small"
style="margin-top:6px"
>

${escapeHTML(
bike.memo || ""
)}

</div>


<div
class="bike-stats"
>


<div class="stat">

<div
class="stat-number"
>

${parts.length}

</div>

<div
class="stat-label"
>

部品

</div>

</div>


<div class="stat">

<div
class="stat-number"
>

${purchased}

</div>

<div
class="stat-label"
>

購入済み

</div>

</div>


<div class="stat">

<div
class="stat-number"
>

¥${total.toLocaleString()}

</div>

<div
class="stat-label"
>

部品代

</div>

</div>


</div>


<div
class="bike-buttons"
>


<button
class="primary"
onclick="selectBike(${bike.id})"
>

開く

</button>


<button
class="secondary"
onclick="editBike(${bike.id})"
>

編集

</button>


<button
class="red"
onclick="deleteBike(${bike.id})"
>

削除

</button>


</div>

`;


list.appendChild(card);

});

}



/* =================================
現在のバイク
================================= */


function getSelectedBike(){

return data.bikes.find(
b=>b.id===selectedBikeId
);

}



/* =================================
選択中バイク表示
================================= */


function renderSelectedBike(){

const area =
document
.getElementById("selectedArea");


const bike =
getSelectedBike();


if(!bike){

area.style.display="none";

return;

}


area.style.display="block";


document
.getElementById(
"selectedBikeName"
)
.textContent=
bike.name;


document
.getElementById(
"selectedBikeYear"
)
.textContent=

bike.year
?
bike.year+"年"
:"";


renderParts();

}



/* =================================
部品追加
================================= */


function addPart(){

const bike =
getSelectedBike();


if(!bike){

alert(
"先にバイクを選択してください。"
);

return;

}


const number =
document
.getElementById("partNumber")
.value
.trim();


const name =
document
.getElementById("partName")
.value
.trim();


const quantity =
Number(
document
.getElementById("partQuantity")
.value
);


if(!number){

alert(
"部品番号を入力してください。"
);

return;

}


if(!name){

alert(
"部品名を入力してください。"
);

return;

}


if(!bike.parts){

bike.parts=[];

}


bike.parts.push({

id:newId(),

number:number,

name:name,

quantity:
quantity || 1,

purchased:false,

purchasePrice:0,

purchaseShop:"",

prices:[]

});


saveData();

clearPartForm();

renderAll();

}



/* =================================
部品編集
================================= */


function editPart(id){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===id
);


if(!part) return;


const number =
prompt(
"部品番号",
part.number
);


if(number===null)
return;


const name =
prompt(
"部品名",
part.name
);


if(name===null)
return;


const quantity =
prompt(
"必要個数",
part.quantity
);


if(quantity===null)
return;


part.number=
number.trim();


part.name=
name.trim();


part.quantity=
Number(quantity)||1;


saveData();

renderAll();

}



/* =================================
部品削除
================================= */


function deletePart(id){

const bike =
getSelectedBike();


if(!bike) return;


if(!confirm(
"この部品を削除しますか？"
))
return;


bike.parts =
bike.parts.filter(
p=>p.id!==id
);


saveData();

renderAll();

}



/* =================================
入力クリア
================================= */


function clearPartForm(){

document
.getElementById("partNumber")
.value="";


document
.getElementById("partName")
.value="";


document
.getElementById("partQuantity")
.value=1;

}



/* =================================
一括検索
================================= */


function searchPart(id){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===id
);


if(!part) return;


const q =
encodeURIComponent(
part.number
);


const urls=[

"https://www.amazon.co.jp/s?k="+q,

"https://search.rakuten.co.jp/search/mall/"+q+"/",

"https://shopping.yahoo.co.jp/search?p="+q,

"https://www.google.com/search?q=site%3Awebike.net+"+q,

"https://www.google.com/search?q=site%3Amonotaro.com+"+q,

"https://auctions.yahoo.co.jp/search/search?p="+q,

"https://jp.mercari.com/search?keyword="+q

];


urls.forEach(
function(url){

window.open(
url,
"_blank"
);

});

}



/* =================================
価格モーダル
================================= */


function openPriceModal(id){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===id
);


if(!part) return;


currentPartId=id;


document
.getElementById("modalPartName")
textContent=

part.name+
"（"+
part.number+
"）";


document
.getElementById("priceShop")
.value="";


document
.getElementById("itemPrice")
.value="";


document
.getElementById("shippingPrice")
.value="";


document
.getElementById("priceModal")
.style.display="block";

}



/* =================================
価格保存
================================= */


function savePrice(){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===currentPartId
);


if(!part) return;


const shop =
document
.getElementById("priceShop")
.value
.trim();


const item =
Number(
document
.getElementById("itemPrice")
.value
);


const shipping =
Number(
document
.getElementById("shippingPrice")
.value
);


if(!shop){

alert(
"販売店を入力してください。"
);

return;

}


if(!part.prices){

part.prices=[];

}


part.prices.push({

id:newId(),

shop:shop,

item:item,

shipping:shipping

});


saveData();

closePriceModal();

renderAll();

}



/* =================================
価格削除
================================= */


function deletePrice(
priceId
){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===currentPartId
);


if(!part) return;


part.prices =
part.prices.filter(
p=>p.id!==priceId
);


saveData();

renderAll();

}



/* =================================
購入登録
================================= */


function purchasePart(id){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===id
);


if(!part) return;


const price =
prompt(

"実際の購入価格を入力してください。",
part.purchasePrice || ""

);


if(price===null)
return;


const shop =
prompt(

"購入先を入力してください。",
part.purchaseShop || ""

);


if(shop===null)
return;


part.purchasePrice=
Number(price)||0;


part.purchaseShop=
shop;


part.purchased=true;


saveData();

renderAll();

}

部品表示

function renderParts(){

document
.getElementById("partsList");

${index===0

>

商品

).toLocaleString()}

<div>

<strong>

¥${total.toLocaleString()}

${price.id}
)"
>

削除

`;

}).join("")}

</div>

`;

}


const status =

`<span

:

`<span

>

const card =

>

部品番号：

)}

${status}

必要個数：
${part.quantity}

購入価格：
¥${Number(

).toLocaleString()}

/* =================================
価格削除
================================= */


function deletePriceById(
partId,
priceId
){

const bike =
getSelectedBike();


if(!bike) return;


const part =
bike.parts.find(
p=>p.id===partId
);


if(!part) return;


part.prices =
part.prices.filter(
p=>p.id!==priceId
);


saveData();

renderAll();

}



/* =================================
集計
================================= */


function updateSummary(){

const bike =
getSelectedBike();


if(!bike){

return;

}


const parts =
bike.parts || [];


document
.getElementById(
"partCount"
)
.textContent=
parts.length;


const purchased =
parts.filter(
p=>p.purchased
).length;


document
.getElementById(
"purchasedCount"
)
.textContent=
purchased;


let total=0;


parts.forEach(
function(part){

if(part.purchased){

total +=
Number(
part.purchasePrice
) *
Number(
part.quantity
);

}

});


document
.getElementById(
"totalCost"
)
.textContent=

"¥"+
total.toLocaleString();

}



/* =================================
全バイク合計
================================= */


function updateAllTotal(){

let total=0;


data.bikes.forEach(
function(bike){

(bike.parts || [])
.forEach(
function(part){

if(part.purchased){

total +=
Number(
part.purchasePrice
) *
Number(
part.quantity
);

}

});

});


document
.getElementById(
"allTotal"
)
.textContent=

"¥"+
total.toLocaleString();

}

.getElementById(
"bikeModal"
)
.style.display="none";

function closePriceModal(){

.getElementById(

}



/* =================================
HTML安全処理
================================= */


function escapeHTML(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



/* =================================
全画面更新
================================= */


function renderAll(){

renderBikes();

renderSelectedBike();

updateAllTotal();

}

初期処理

[];
