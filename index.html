# 旧車レストア部品価格比較アプリ Ver.3

```html
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
旧車レストア部品価格比較 Ver.3
</title>

<style>

:root {

    --bg:#f3f0e9;
    --card:#ffffff;
    --text:#222;
    --sub:#777;

    --accent:#a84b12;
    --accent-dark:#7d3508;

    --green:#287a4a;
    --green-light:#e5f4eb;

    --red:#b42318;
    --red-light:#fde8e7;

    --blue:#315f91;
    --blue-light:#e8f0f9;

    --border:#dddddd;

}

* {

    box-sizing:border-box;

}

body {

    margin:0;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

    background:var(--bg);

    color:var(--text);

}

header {

    background:#20252b;

    color:white;

    padding:20px 16px;

}

header h1 {

    margin:0;

    font-size:21px;

}

header p {

    margin:5px 0 0;

    color:#cccccc;

    font-size:13px;

}

main {

    max-width:850px;

    margin:auto;

    padding:16px;

}

.card {

    background:white;

    border-radius:16px;

    padding:16px;

    margin-bottom:16px;

    box-shadow:
    0 3px 12px
    rgba(0,0,0,.07);

}

h2 {

    margin-top:0;

    font-size:18px;

}

h3 {

    margin-top:0;

}

label {

    display:block;

    margin-top:10px;

    margin-bottom:5px;

    font-weight:bold;

    font-size:14px;

}

input {

    width:100%;

    padding:12px;

    border:
    2px solid
    var(--border);

    border-radius:9px;

    font-size:16px;

}

input:focus {

    outline:none;

    border-color:var(--accent);

}

button {

    border:none;

    border-radius:9px;

    padding:10px 13px;

    font-weight:bold;

    cursor:pointer;

}

.primary {

    background:var(--accent);

    color:white;

}

.primary:hover {

    background:var(--accent-dark);

}

.secondary {

    background:#eeeeee;

    color:#333;

}

.green {

    background:var(--green);

    color:white;

}

.blue {

    background:var(--blue);

    color:white;

}

.red {

    background:var(--red);

    color:white;

}

.full {

    width:100%;

    margin-top:12px;

}

.summary {

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

}

.summary-box {

    background:#f5f5f5;

    border-radius:12px;

    padding:14px;

    text-align:center;

}

.summary-number {

    font-size:22px;

    font-weight:bold;

    color:var(--accent);

}

.small {

    font-size:12px;

    color:var(--sub);

}

.part-card {

    border:
    1px solid
    var(--border);

    border-radius:13px;

    padding:14px;

    margin-top:12px;

}

.part-title {

    font-size:17px;

    font-weight:bold;

}

.part-number {

    color:var(--sub);

    font-size:13px;

    margin-top:4px;

}

.part-info {

    margin-top:8px;

    font-size:14px;

}

.part-buttons {

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:13px;

}

.part-buttons button {

    flex:1;

    min-width:110px;

}

.status {

    display:inline-block;

    padding:4px 9px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

}

.status-waiting {

    background:#fff1d6;

    color:#996000;

}

.status-purchased {

    background:var(--green-light);

    color:var(--green);

}

.price-box {

    margin-top:14px;

    padding:12px;

    border-radius:11px;

    background:#f7f7f7;

}

.price-row {

    display:grid;

    grid-template-columns:
    1.2fr
    1fr
    1fr
    1fr
    auto;

    gap:6px;

    align-items:center;

    padding:8px 0;

    border-bottom:
    1px solid
    var(--border);

    font-size:13px;

}

.price-row:last-child {

    border-bottom:none;

}

.price-best {

    background:
    var(--green-light);

    border-radius:8px;

    padding:8px;

}

.best-label {

    color:var(--green);

    font-weight:bold;

}

.empty {

    text-align:center;

    color:var(--sub);

    padding:25px 0;

}

.modal {

    display:none;

    position:fixed;

    z-index:100;

    left:0;

    top:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,.55);

    padding:20px;

    overflow:auto;

}

.modal-content {

    max-width:600px;

    margin:30px auto;

    background:white;

    border-radius:16px;

    padding:18px;

}

.modal-buttons {

    display:flex;

    gap:8px;

    margin-top:15px;

}

.modal-buttons button {

    flex:1;

}

@media(max-width:600px) {

    .summary {

        grid-template-columns:
        repeat(2,1fr);

    }

    .price-row {

        grid-template-columns:
        1fr 1fr;

        gap:5px;

    }

}

</style>

</head>


<body>


<header>

<h1>
🔧 旧車レストア部品価格比較
</h1>

<p>
Ver.3 ｜ 部品管理・価格比較・購入管理
</p>

</header>


<main>


<!-- ======================
バイク情報
====================== -->

<div class="card">

<h2>
🏍 レストア車両
</h2>

<label>
車種
</label>

<input
id="bikeName"
placeholder="例：YAMAHA DX250"
>

<label>
年式
</label>

<input
id="bikeYear"
placeholder="例：1974"
>

<button
class="primary full"
onclick="saveBike()"
>

バイク情報を保存

</button>

</div>


<!-- ======================
集計
====================== -->

<div class="card">

<h2>
💰 レストア費用・部品状況
</h2>

<div class="summary">

<div class="summary-box">

<div class="small">
登録部品
</div>

<div
class="summary-number"
id="partCount"
>
0
</div>

</div>


<div class="summary-box">

<div class="small">
購入済み
</div>

<div
class="summary-number"
id="purchasedCount"
>
0
</div>

</div>


<div class="summary-box">

<div class="small">
部品代合計
</div>

<div
class="summary-number"
id="totalCost"
>
¥0
</div>

</div>

</div>

</div>


<!-- ======================
部品登録
====================== -->

<div class="card">

<h2>
➕ 部品を登録
</h2>

<label>
部品番号
</label>

<input
id="partNumber"
placeholder="例：92055-1234"
>

<label>
部品名
</label>

<input
id="partName"
placeholder="例：フランジボルト"
>

<label>
必要個数
</label>

<input
id="partQuantity"
type="number"
min="1"
value="1"
>

<button
class="primary full"
onclick="addPart()"
>

部品を登録

</button>

</div>


<!-- ======================
部品一覧
====================== -->

<div class="card">

<h2>
🔩 部品一覧
</h2>

<div
id="partsList"
>

</div>

</div>


</main>


<!-- ======================
価格登録モーダル
====================== -->

<div
id="priceModal"
class="modal"
>

<div class="modal-content">

<h2>
💴 価格候補を登録
</h2>

<p
id="modalPartName"
>
</p>


<label>
販売店
</label>

<input
id="priceShop"
placeholder="例：Yahoo!ショッピング"
>


<label>
商品価格
</label>

<input
id="itemPrice"
type="number"
placeholder="例：3000"
>


<label>
送料
</label>

<input
id="shippingPrice"
type="number"
placeholder="例：660"
>


<div class="modal-buttons">

<button
class="primary"
onclick="savePrice()"
>

登録

</button>

<button
class="secondary"
onclick="closeModal()"
>

キャンセル

</button>

</div>

</div>

</div>


<script>


/* ======================
データ
====================== */


let bike =
JSON.parse(
localStorage.getItem("bikeInfo")
) || {

    name:"",
    year:""

};


let parts =
JSON.parse(
localStorage.getItem("bikePartsV3")
) || [];



let currentPartId = null;



/* ======================
バイク情報
====================== */


function saveBike() {

bike.name =
document
.getElementById("bikeName")
.value
.trim();


bike.year =
document
.getElementById("bikeYear")
.value
.trim();


localStorage.setItem(

"bikeInfo",

JSON.stringify(bike)

);


alert(
"バイク情報を保存しました。"
);

}



/* ======================
部品追加
====================== */


function addPart() {

const number =
document
.getElementById("partNumber")
.value
.trim();


const name =
document
.getElementById("partName")
.value
.trim();


const quantity =
Number(
document
.getElementById("partQuantity")
.value
);


if(!number) {

alert(
"部品番号を入力してください。"
);

return;

}


if(!name) {

alert(
"部品名を入力してください。"
);

return;

}


parts.push({

    id:Date.now(),

    number:number,

    name:name,

    quantity:
    quantity || 1,

    purchased:false,

    purchasePrice:0,

    purchaseShop:"",

    prices:[]

});


saveParts();

clearPartForm();

renderParts();

}



/* ======================
部品保存
====================== */


function saveParts() {

localStorage.setItem(

"bikePartsV3",

JSON.stringify(parts)

);

}



/* ======================
入力欄クリア
====================== */


function clearPartForm() {

document
.getElementById("partNumber")
.value="";


document
.getElementById("partName")
.value="";


document
.getElementById("partQuantity")
.value=1;

}



/* ======================
部品一覧
====================== */


function renderParts() {

const list =
document
.getElementById("partsList");


list.innerHTML="";


if(parts.length===0) {

list.innerHTML=`

<div class="empty">

まだ部品が登録されていません。

</div>

`;

updateSummary();

return;

}


parts.forEach(function(part) {


const card =
document.createElement("div");


card.className=
"part-card";


const status =
part.purchased

?

`<span class="status status-purchased">
購入済み
</span>`

:

`<span class="status status-waiting">
未購入
</span>`;


let priceHTML="";


if(part.prices &&
part.prices.length>0) {

const sorted =
[...part.prices]
.sort(
(a,b)=>
(a.item+a.shipping)
-
(b.item+b.shipping)
);


priceHTML=`

<div class="price-box">

<strong>
価格候補
</strong>

${sorted.map(function(price,index) {

const total =
Number(price.item)
+
Number(price.shipping);


return `

<div class="
price-row
${index===0
? "price-best"
: ""}
">

<div>

${escapeHTML(price.shop)}

${index===0
? '<div class="best-label">★ 最安</div>'
: ""}

</div>


<div>
商品 ¥${Number(price.item)
.toLocaleString()}
</div>


<div>
送料 ¥${Number(price.shipping)
.toLocaleString()}
</div>


<div>
<strong>
¥${total
.toLocaleString()}
</strong>
</div>


<button
class="secondary"
onclick="deletePrice(
${part.id},
${price.id}
)"
>
削除
</button>

</div>

`;

}).join("")}

</div>

`;

}


card.innerHTML=`

<div>

<div class="part-title">

${escapeHTML(part.name)}

</div>


<div class="part-number">

部品番号：
${escapeHTML(part.number)}

</div>

</div>


<div class="part-info">

${status}

</div>


<div class="part-info">

必要個数：
${part.quantity}

</div>


<div class="part-info">

購入価格：
¥${Number(part.purchasePrice)
.toLocaleString()}

</div>


<div class="part-info">

購入先：
${escapeHTML(
part.purchaseShop || "未登録"
)}

</div>


${priceHTML}


<div class="part-buttons">

<button
class="primary"
onclick="searchPart(
${part.id}
)"
>

🔎 一括検索

</button>


<button
class="blue"
onclick="openPriceModal(
${part.id}
)"
>

💴 価格候補追加

</button>


<button
class="green"
onclick="purchasePart(
${part.id}
)"
>

✓ 購入登録

</button>


<button
class="secondary"
onclick="editPart(
${part.id}
)"
>

✏️ 編集

</button>


<button
class="red"
onclick="deletePart(
${part.id}
)"
>

削除

</button>

</div>

`;


list.appendChild(card);

});


updateSummary();

}



/* ======================
価格検索
====================== */


function searchPart(id) {

const part =
parts.find(
p=>p.id===id
);


if(!part) return;


const q =
encodeURIComponent(
part.number
);


const urls=[

"https://www.amazon.co.jp/s?k="+q,

"https://search.rakuten.co.jp/search/mall/"+q+"/",

"https://shopping.yahoo.co.jp/search?p="+q,

"https://www.google.com/search?q=site%3Awebike.net+"+q,

"https://www.google.com/search?q=site%3Amonotaro.com+"+q,

"https://auctions.yahoo.co.jp/search/search?p="+q,

"https://jp.mercari.com/search?keyword="+q

];


urls.forEach(function(url){

window.open(
url,
"_blank"
);

});

}



/* ======================
価格候補モーダル
====================== */


function openPriceModal(id) {

const part =
parts.find(
p=>p.id===id
);


if(!part) return;


currentPartId=id;


document
.getElementById("modalPartName")
textContent=

part.name+
"（"+
part.number+
"）";


document
.getElementById("priceShop")
.value="";


document
.getElementById("itemPrice")
.value="";


document
.getElementById("shippingPrice")
.value="";


document
.getElementById("priceModal")
.style.display="block";

}



function closeModal() {

document
.getElementById("priceModal")
.style.display="none";

currentPartId=null;

}



/* ======================
価格候補保存
====================== */


function savePrice() {

const part =
parts.find(
p=>p.id===currentPartId
);


if(!part) return;


const shop =
document
.getElementById("priceShop")
.value
.trim();


const item =
Number(
document
.getElementById("itemPrice")
.value
);


const shipping =
Number(
document
.getElementById("shippingPrice")
.value
);


if(!shop) {

alert(
"販売店を入力してください。"
);

return;

}


if(!item && item!==0) {

alert(
"商品価格を入力してください。"
);

return;

}


if(!shipping && shipping!==0) {

alert(
"送料を入力してください。"
);

return;

}


if(!part.prices) {

part.prices=[];

}


part.prices.push({

    id:Date.now(),

    shop:shop,

    item:item,

    shipping:shipping

});


saveParts();

closeModal();

renderParts();

}



/* ======================
価格削除
====================== */


function deletePrice(
partId,
priceId
) {

const part =
parts.find(
p=>p.id===partId
);


if(!part) return;


part.prices =
part.prices.filter(
p=>p.id!==priceId
);


saveParts();

renderParts();

}



/* ======================
購入登録
====================== */


function purchasePart(id) {

const part =
parts.find(
p=>p.id===id
);


if(!part) return;


const price =
prompt(

"実際に購入した価格を入力してください。",

part.purchasePrice || ""

);


if(price===null)
return;


const shop =
prompt(

"購入先を入力してください。",

part.purchaseShop || ""

);


if(shop===null)
return;


part.purchasePrice =
Number(price)||0;


part.purchaseShop =
shop;


part.purchased=true;


saveParts();

renderParts();

}



/* ======================
部品編集
====================== */


function editPart(id) {

const part =
parts.find(
p=>p.id===id
);


if(!part) return;


const number =
prompt(
"部品番号",
part.number
);


if(number===null)
return;


const name =
prompt(
"部品名",
part.name
);


if(name===null)
return;


const quantity =
prompt(
"必要個数",
part.quantity
);


if(quantity===null)
return;


part.number=
number.trim();


part.name=
name.trim();


part.quantity=
Number(quantity)||1;


saveParts();

renderParts();

}



/* ======================
部品削除
====================== */


function deletePart(id) {

if(!confirm(
"この部品を削除しますか？"
))
return;


parts =
parts.filter(
p=>p.id!==id
);


saveParts();

renderParts();

}



/* ======================
集計
====================== */


function updateSummary() {

document
.getElementById("partCount")
.textContent=
parts.length;


const purchased =
parts.filter(
p=>p.purchased
).length;


document
.getElementById("purchasedCount")
.textContent=
purchased;


let total=0;


parts.forEach(function(part){

if(part.purchased){

total +=
Number(part.purchasePrice)
*
Number(part.quantity);

}

});


document
.getElementById("totalCost")
.textContent=

"¥"+
total.toLocaleString();

}



/* ======================
HTML安全処理
====================== */


function escapeHTML(text) {

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



/* ======================
初期表示
====================== */


document
.getElementById("bikeName")
.value=
bike.name;


document
.getElementById("bikeYear")
.value=
bike.year;


renderParts();


</script>

</body>
</html>
```
