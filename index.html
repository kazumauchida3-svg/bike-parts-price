# 旧車レストア部品価格比較アプリ Ver.2

```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>旧車レストア部品価格比較 Ver.2</title>

<style>

:root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #222;
    --sub: #777;
    --accent: #a84b12;
    --accent-dark: #7d3508;
    --green: #2f7d4c;
    --border: #dddddd;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: var(--bg);
    color: var(--text);
}

header {
    background: #20252b;
    color: white;
    padding: 20px 16px;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

header p {
    margin: 5px 0 0;
    color: #cccccc;
    font-size: 13px;
}

main {
    max-width: 800px;
    margin: auto;
    padding: 16px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    font-size: 18px;
}

label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;

    border:
        2px solid
        var(--border);

    border-radius: 9px;

    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: var(--accent);
}

button {
    border: none;
    border-radius: 9px;

    padding: 10px 13px;

    font-weight: bold;

    cursor: pointer;
}

.primary {
    background: var(--accent);
    color: white;
}

.primary:hover {
    background: var(--accent-dark);
}

.secondary {
    background: #eeeeee;
    color: #333;
}

.green {
    background: var(--green);
    color: white;
}

.full {
    width: 100%;
    margin-top: 12px;
}

.part-card {
    border:
        1px solid
        var(--border);

    border-radius: 12px;

    padding: 14px;

    margin-top: 12px;
}

.part-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.part-name {
    font-weight: bold;
    font-size: 17px;
}

.part-number {
    color: var(--sub);
    font-size: 13px;
    margin-top: 3px;
}

.part-info {
    margin-top: 10px;
    font-size: 14px;
}

.part-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;

    margin-top: 12px;
}

.part-buttons button {
    flex: 1;
    min-width: 100px;
}

.summary {
    display: grid;
    grid-template-columns:
        repeat(2,1fr);

    gap: 10px;
}

.summary-box {
    background: #f5f5f5;

    border-radius: 12px;

    padding: 14px;

    text-align: center;
}

.summary-number {
    font-size: 24px;
    font-weight: bold;

    color: var(--accent);
}

.small {
    font-size: 12px;
    color: var(--sub);
}

.empty {
    color: var(--sub);
    text-align: center;

    padding: 25px 0;
}

.status-purchased {
    color: var(--green);
    font-weight: bold;
}

.status-waiting {
    color: #b06d00;
    font-weight: bold;
}

@media(max-width:500px) {

    .part-header {
        display: block;
    }

    .summary {
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>
</head>

<body>

<header>

<h1>
🔧 旧車レストア部品価格比較
</h1>

<p>
Ver.2 ｜ 部品管理・購入管理・価格検索
</p>

</header>


<main>


<!-- バイク情報 -->

<div class="card">

<h2>
🏍 レストア中のバイク
</h2>

<label>
車種
</label>

<input
id="bikeName"
placeholder="例：YAMAHA DX250"
>

<label>
年式
</label>

<input
id="bikeYear"
placeholder="例：1974"
>

<button
class="primary full"
onclick="saveBike()"
>

バイク情報を保存

</button>

</div>



<!-- 集計 -->

<div class="card">

<h2>
💰 レストア費用
</h2>

<div class="summary">

<div class="summary-box">

<div class="small">
登録部品
</div>

<div
class="summary-number"
id="partCount"
>
0
</div>

</div>


<div class="summary-box">

<div class="small">
購入済み部品代
</div>

<div
class="summary-number"
id="totalCost"
>
¥0
</div>

</div>

</div>

</div>



<!-- 部品登録 -->

<div class="card">

<h2>
➕ 部品を登録
</h2>


<label>
部品番号
</label>

<input
id="partNumber"
placeholder="例：92055-1234"
>


<label>
部品名
</label>

<input
id="partName"
placeholder="例：フロントフェンダー"
>


<label>
必要個数
</label>

<input
id="partQuantity"
type="number"
value="1"
min="1"
>


<button
class="primary full"
onclick="addPart()"
>

部品を登録

</button>

</div>



<!-- 部品一覧 -->

<div class="card">

<h2>
🔩 部品一覧
</h2>

<div
id="partsList"
>

</div>

</div>


</main>



<script>


/* =========================
データ読み込み
========================= */


let bike =
JSON.parse(
localStorage.getItem("bikeInfo")
) || {
name: "",
year: ""
};


let parts =
JSON.parse(
localStorage.getItem("bikeParts")
) || [];



/* =========================
販売サイト
========================= */


const shops = [

{
name: "Amazon",

url: function(q) {

return "https://www.amazon.co.jp/s?k=" + q;

}

},

{
name: "楽天市場",

url: function(q) {

return "https://search.rakuten.co.jp/search/mall/" + q + "/";

}

},

{
name: "Yahoo!ショッピング",

url: function(q) {

return "https://shopping.yahoo.co.jp/search?p=" + q;

}

},

{
name: "Webike",

url: function(q) {

return
"https://www.google.com/search?q=site%3Awebike.net+" + q;

}

},

{
name: "モノタロウ",

url: function(q) {

return
"https://www.google.com/search?q=site%3Amonotaro.com+" + q;

}

},

{
name: "Yahoo!オークション",

url: function(q) {

return
"https://auctions.yahoo.co.jp/search/search?p=" + q;

}

},

{
name: "メルカリ",

url: function(q) {

return
"https://jp.mercari.com/search?keyword=" + q;

}

}

];



/* =========================
バイク情報
========================= */


function saveBike() {

bike.name =
document
.getElementById("bikeName")
.value
.trim();


bike.year =
document
.getElementById("bikeYear")
.value
.trim();


localStorage.setItem(

"bikeInfo",

JSON.stringify(bike)

);


alert("バイク情報を保存しました。");

}



/* =========================
部品追加
========================= */


function addPart() {

const number =
document
.getElementById("partNumber")
.value
.trim();


const name =
document
.getElementById("partName")
.value
.trim();


const quantity =
Number(
document
.getElementById("partQuantity")
.value
);


if (!number) {

alert("部品番号を入力してください。");

return;

}


if (!name) {

alert("部品名を入力してください。");

return;

}


const part = {

id: Date.now(),

number: number,

name: name,

quantity: quantity || 1,

purchased: false,

price: 0,

shop: ""

};


parts.push(part);


saveParts();


document
.getElementById("partNumber")
.value = "";


document
.getElementById("partName")
.value = "";


document
.getElementById("partQuantity")
.value = 1;


renderParts();

}



/* =========================
部品保存
========================= */


function saveParts() {

localStorage.setItem(

"bikeParts",

JSON.stringify(parts)

);

}



/* =========================
部品一覧表示
========================= */


function renderParts() {

const list =
document
.getElementById("partsList");


list.innerHTML = "";


if (parts.length === 0) {

list.innerHTML = `

<div class="empty">

まだ部品が登録されていません

</div>

`;

updateSummary();

return;

}


parts.forEach(function(part) {

const card =
document.createElement("div");


card.className =
"part-card";


const status =
part.purchased

?

'<span class="status-purchased">購入済み</span>'

:

'<span class="status-waiting">未購入</span>';


card.innerHTML = `

<div class="part-header">

<div>

<div class="part-name">

${escapeHTML(part.name)}

</div>


<div class="part-number">

部品番号：
${escapeHTML(part.number)}

</div>

</div>


<div>

${status}

</div>

</div>


<div class="part-info">

必要個数：
${part.quantity}

</div>


<div class="part-info">

購入価格：
¥${Number(part.price).toLocaleString()}

</div>


<div class="part-info">

購入先：
${escapeHTML(part.shop || "未登録")}

</div>


<div class="part-buttons">

<button
class="primary"
onclick="searchPart(${part.id})"
>

🔎 価格検索

</button>


<button
class="green"
onclick="purchasePart(${part.id})"
>

購入登録

</button>


<button
class="secondary"
onclick="deletePart(${part.id})"
>

削除

</button>

</div>

`;


list.appendChild(card);

});


updateSummary();

}



/* =========================
価格検索
========================= */


function searchPart(id) {

const part =
parts.find(function(item) {

return item.id === id;

});


if (!part) return;


const query =
encodeURIComponent(
part.number
);


shops.forEach(function(shop) {

window.open(

shop.url(query),

"_blank"

);

});

}



/* =========================
購入登録
========================= */


function purchasePart(id) {

const part =
parts.find(function(item) {

return item.id === id;

});


if (!part) return;


const price =
prompt(

"購入価格を入力してください（1個あたり）",

part.price || ""

);


if (price === null) {

return;

}


const shop =
prompt(

"購入先を入力してください",

part.shop || ""

);


if (shop === null) {

return;

}


part.price =
Number(price) || 0;


part.shop =
shop;


part.purchased =
true;


saveParts();


renderParts();

}



/* =========================
削除
========================= */


function deletePart(id) {

const result =
confirm(
"この部品を削除しますか？"
);


if (!result) return;


parts =
parts.filter(function(part) {

return part.id !== id;

});


saveParts();


renderParts();

}



/* =========================
集計
========================= */


function updateSummary() {

document
.getElementById("partCount")
.textContent =
parts.length;


let total = 0;


parts.forEach(function(part) {

if (part.purchased) {

total +=
Number(part.price)
*
Number(part.quantity);

}

});


document
.getElementById("totalCost")
.textContent =

"¥" +
total.toLocaleString();

}



/* =========================
HTML安全処理
========================= */


function escapeHTML(text) {

return String(text)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}



/* =========================
初期表示
========================= */


document
.getElementById("bikeName")
.value =
bike.name;


document
.getElementById("bikeYear")
.value =
bike.year;


renderParts();


</script>

</body>
</html>
```
